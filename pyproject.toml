[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symmetrynet"
version = "0.1.0"
description = "E(3)-equivariant graph neural networks for molecular property prediction on QM9"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7",
    "torch-geometric>=2.6",
    "e3nn>=0.5.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Bounded below 0.17: a linter pinned only by a lower bound silently adopts new rules
    # on every release, so CI can turn red with no change to the code -- which is how the
    # badge on this repo first went red. Patch upgrades are fine; new minors are opt-in.
    "ruff>=0.16.2,<0.17",
    "tensorboard>=2.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# OneDrive denies the atomic rename pytest uses to create .pytest_cache, so the cache
# provider is disabled rather than left to emit a warning on every run.
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# State it rather than let ruff infer it. Whether `symmetrynet` counts as first-party or
# third-party decides which group its imports belong in, and the inference can land
# differently depending on whether the package is visible in site-packages (it is, via
# `pip install -e .`) or only under `src/`. That made CI report I001 on scripts that lint
# clean locally, with the same ruff version and a cold cache -- a failure that is
# unreproducible by construction. Declaring it removes the guess.
known-first-party = ["symmetrynet"]
