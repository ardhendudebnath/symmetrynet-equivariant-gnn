name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU only)
        # The CPU wheel is a fraction of the CUDA build's size and the suite needs no GPU:
        # every symmetry test runs in float64 on synthetic molecules, and float64 is
        # slower on consumer GPUs anyway. The one CUDA-dependent test skips itself.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          python -m ruff --version
          python -c "import torch, e3nn, torch_geometric; print('torch', torch.__version__)"

      - name: Lint
        # `python -m ruff`, not the bare `ruff` console script: the latter depends on the
        # package's entry point being on PATH, which is one more thing that can quietly
        # differ between a local shell and the runner. The module form only needs the
        # package importable, which the install step above has already proved.
        run: python -m ruff check src tests scripts --output-format=github

      - name: Run tests
        # `always()` so a style failure cannot hide a correctness failure. Previously a
        # red Lint step short-circuited the job and the test results were never produced,
        # which is the wrong way round: lint is cosmetic, tests are the point.
        if: always()
        # No dataset download: every test builds its own molecules, so CI needs neither
        # QM9 (~400 MB) nor MD17 (~220 MB).
        run: pytest -q

  verify-equivariance:
    # Split out so the headline claim has its own visible pass/fail rather than being
    # buried in a 243-test summary. This is the property the whole project exists to
    # provide; if it ever breaks, that should be legible at a glance.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          python -m ruff --version
          python -c "import torch, e3nn, torch_geometric; print('torch', torch.__version__)"
      - name: Rotation, translation, inversion and permutation invariance
        run: pytest tests/test_model_equivariance.py tests/test_forces.py -q
